name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  # ── Python-only tests (Parameters, eval, etc.) ────────────────────────────
  python-tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python test dependencies
        run: pip install pytest pytest-cov

      - name: Run Python-only tests (no C++ extension)
        run: pytest tests/python/ -v --tb=short

  # ── C++ build + tests ─────────────────────────────────────────────────────
  cpp-tests:
    name: C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CMake + pybind11
        run: pip install cmake pybind11

      - name: Configure (Release + tests on)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DPython_EXECUTABLE=$(python -c "import sys; print(sys.executable)")

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure

  # ── Full wheel build + Python extension tests ─────────────────────────────
  wheel-tests:
    name: Wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install scikit-build-core pybind11 cmake pytest

      - name: Install package (editable, builds C++ extension)
        run: pip install -e ".[dev]"

      - name: Run all tests (Python + extension)
        run: pytest tests/python/ -v --tb=short
